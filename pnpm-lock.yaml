lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

overrides:
  '@opencvjs/web@*': workspace:*
  '@opencvjs/node@*': workspace:*
  '@opencvjs/worker@*': workspace:*
  '@opencvjs/types@*': workspace:*

importers:

  .:
