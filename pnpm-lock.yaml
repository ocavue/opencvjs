      '@opencvjs/types':
        specifier: workspace:*
        version: link:../types
    devDependencies:
      '@types/node':
        specifier: ^24.10.1
        version: 24.13.2
      jimp:
        specifier: ^1.7.0
        version: 1.7.0
      typescript:
        specifier: ^6.0.3
        version: 6.0.3
      vitest:
        specifier: ^4.1.12
